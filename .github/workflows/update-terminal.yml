name: Update terminal
on:
  schedule:
    - cron: "0 */6 * * *"   # cada 6 horas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate terminal.svg
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          # Para incluir repos privados crea un PAT y guárdalo como secret PAT_TOKEN
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python generate_terminal.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terminal.svg
          git diff --cached --quiet || git commit -m "chore: update terminal"
          git push
